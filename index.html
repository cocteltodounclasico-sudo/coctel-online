<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cóctel On-Line | Clásicos de Selección</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-oro: #d4af37;
            --color-oscuro: #0a0a0a;
            --color-secundario: #151515;
            --color-gris: #888;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--color-oscuro);
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
        }

        .main-card {
            background: rgba(21, 21, 21, 0.85);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 40px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 400px;
            width: 90%;
            z-index: 1;
        }

        .logo-container h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            color: var(--color-oro);
            margin: 0;
            letter-spacing: -2px;
            line-height: 1;
        }

        .subtitulo {
            letter-spacing: 8px;
            font-size: 0.8rem;
            margin-bottom: 40px;
            color: var(--color-gris);
            text-transform: uppercase;
        }

        .vumetro-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 5px;
            height: 60px;
            margin-bottom: 30px;
        }
        .v-bar {
            width: 8px;
            background: linear-gradient(to top, var(--color-oro), #fff);
            height: 5px;
            border-radius: 4px;
            transition: height 0.1s ease;
        }

        .btn-play {
            background: var(--color-oro);
            border: none;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-play svg { fill: var(--color-oscuro); width: 45px; height: 45px; }

        .social-bar {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .social-icon {
            color: var(--color-gris);
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .social-icon:hover { color: var(--color-oro); }

        .staff-info {
            font-size: 0.7rem;
            color: var(--color-gris);
            margin-top: 20px;
            line-height: 1.6;
        }

        input[type=range] {
            width: 100px;
            accent-color: var(--color-oro);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="main-card">
        <div class="logo-container">
            <h1>CÓCTEL</h1>
            <div class="subtitulo">On-Line</div>
        </div>

        <div class="vumetro-container" id="vumetro">
            <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
            <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
        </div>
        
        <button class="btn-play" id="mainButton">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <div>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
        </div>

        <div class="staff-info">
            Voces: Pedro Aníbal Mansilla & Pablo Shefer<br>
            <strong>24 HORAS DE CLÁSICOS</strong>
        </div>

        <div class="social-bar">
            <a href="https://www.instagram.com/" class="social-icon" target="_blank">INSTAGRAM</a>
            <a href="https://www.facebook.com/" class="social-icon" target="_blank">FACEBOOK</a>
        </div>
    </div>

    <audio id="audioStream" preload="none"></audio>

    <script>
        const audio = document.getElementById('audioStream');
        const btn = document.getElementById('mainButton');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const volumeSlider = document.getElementById('volumeSlider');
        const vBars = document.querySelectorAll('.v-bar');

        // --- CONFIGURACIÓN DEL TÚNEL ---
        const proxyUrl = "https://icecast-ssl-proxy.herokuapp.com/";
        const radioUrl = "http://s9.myradiostream.com:47566/;stream.mp3";
        const streamUrl = proxyUrl + radioUrl;

        btn.addEventListener('click', function() {
            if (audio.paused) {
                // Si está vacío, intentamos con el Túnel primero
                if (!audio.src || audio.src === "" || audio.src === window.location.href) {
                    audio.src = streamUrl;
                }
                
                audio.play().then(() => {
                    actualizarInterfaz(true);
                }).catch(error => {
                    console.log("Túnel fallido o bloqueado, intentando directo...");
                    audio.src = radioUrl;
                    audio.play().then(() => {
                        actualizarInterfaz(true);
                    }).catch(err => {
                        alert("Para escuchar en móviles, por favor permite 'contenido no seguro' en los ajustes de tu navegador o usa la versión de escritorio.");
                    });
                });
            } else {
                audio.pause();
                audio.src = ""; 
                actualizarInterfaz(false);
            }
        });

        function actualizarInterfaz(playing) {
            if (playing) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                startVumetro();
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                stopVumetro();
            }
        }

        let vumetroInterval;
        function startVumetro() {
            vumetroInterval = setInterval(() => {
                vBars.forEach(bar => {
                    const height = Math.random() * 50 + 5;
                    bar.style.height = height + 'px';
                });
            }, 100);
        }
        function stopVumetro() {
            clearInterval(vumetroInterval);
            vBars.forEach(bar => bar.style.height = '5px');
        }

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        // --- FONDO ANIMADO ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        function initParticles() { for (let i = 0; i < 100; i++) particles.push(new Particle()); }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        initParticles(); animate();
    </script>
</body>
</html>
