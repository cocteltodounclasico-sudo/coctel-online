<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cóctel Todo Un Clásico</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            border: 1px solid #d4af37;
            padding: 40px;
            border-radius: 10px;
            background-color: #0a0a0a;
            max-width: 350px;
            width: 90%;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #d4af37;
            margin-bottom: 10px;
        }
        .locutores {
            margin-bottom: 25px;
        }
        .nombre {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #d4af37;
            display: block;
            font-size: 1.1rem;
            margin: 5px 0;
        }
        /* REPRODUCTOR 1.6: Sin filtros, sin cambios. Pureza total. */
        audio {
            width: 100%;
            margin: 20px 0;
        }
        .support {
            margin-top: 30px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding-top: 20px;
        }
        .frase {
            font-size: 0.75rem;
            color: #d4af37;
            margin-bottom: 15px;
            display: block;
        }
        .btn-link {
            text-decoration: none;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Cóctel</div>
        
        <div class="locutores">
            <span class="nombre">Pedro Aníbal Mansilla</span>
            <span class="nombre">Pablo Shefer</span>
        </div>

        <audio controls>
            <source src="https://stream.estudiosmax.com/8144/stream" type="audio/mpeg">
            Tu navegador no soporta el audio.
        </audio>

        <div class="support">
            <span class="frase">"Ayudanos a mantener el vinilo girando"</span>
            <a href="https://cafecito.app/coctelon-line" target="_blank" class="btn-link">
                Invitanos un Cafecito
            </a>
        </div>
    </div>
</body>
</html>
