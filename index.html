<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cóctel Todo Un Clásico | On-Line</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --color-oro: #d4af37; --color-oscuro: #0a0a0a; --color-gris: #888; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--color-oscuro); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        /* Fondo estático */
        .bg-fixed { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #151515 0%, #000 100%); }

        /* Vinilos optimizados (Usa GPU del celular para no afectar el audio) */
        .vinyl-css {
            position: absolute; width: 120px; height: 120px;
            background: radial-gradient(circle, #222 0%, #111 40%, #000 100%);
            border-radius: 50%; opacity: 0.12; z-index: -1;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.1);
            animation: float 25s linear infinite, spin 6s linear infinite;
        }
        .vinyl-css::after {
            content: ''; position: absolute; top: 35%; left: 35%; width: 30%; height: 30%;
            background: var(--color-oro); border-radius: 50%;
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-20vh) rotate(360deg); }
        }

        .main-card { background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px); padding: 40px; border-radius: 40px; border: 1px solid rgba(212, 175, 55, 0.3); text-align: center; max-width: 400px; width: 85%; z-index: 10; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        
        .logo-container h1 { font-family: 'Playfair Display', serif; font-size: 3rem; color: var(--color-oro); margin: 0; text-shadow: 0 0 10px rgba(212,175,55,0.2); }
        .subtitulo { letter-spacing: 5px; font-size: 0.7rem; color: var(--color-gris); text-transform: uppercase; margin-bottom: 20px; }
        
        #info-box { border-top: 1px solid rgba(212,175,55,0.1); border-bottom: 1px solid rgba(212,175,55,0.1); padding: 12px 0; margin-bottom: 25px; }
        .info-title { font-weight: 600; color: #fff; display: block; letter-spacing: 1px; }
        .info-sub { color: var(--color-oro); font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; }

        .btn-play { background: var(--color-oro); border: none; width: 85px; height: 85px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; transition: 0.3s; }
        .btn-play svg { fill: var(--color-oscuro); width: 40px; height: 40px; }
        .btn-play:hover { transform: scale(1.05); }
        
        .vol-control { margin-bottom: 20px; }
        input[type=range] { accent-color: var(--color-oro); width: 120px; cursor: pointer; }

        .staff { font-size: 0.75rem; color: var(--color-gris); line-height: 1.6; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; }
        .staff strong { color: #aaa; display: block; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="bg-fixed"></div>
    
    <div class="vinyl-css" style="left: 10%; animation-delay: 0s;"></div>
    <div class="vinyl-css" style="left: 75%; animation-delay: 7s; width: 90px; height: 90px;"></div>
    <div class="vinyl-css" style="left: 40%; animation-delay: 15s; width: 140px; height: 140px;"></div>

    <div class="main-card">
        <div class="logo-container">
            <h1>CÓCTEL</h1>
            <div class="subtitulo">Todo Un Clásico</div>
        </div>
        
        <div id="info-box">
            <span class="info-title">LA MEJOR MÚSICA</span>
            <span class="info-sub">EN VIVO 24HS</span>
        </div>

        <button class="btn-play" id="mainButton">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <div class="vol-control">
            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
        </div>

        <div class="staff">
            Voces: Pedro Aníbal Mansilla & Pablo Shefer
            <strong>www.cocteltodounclasico.com.ar</strong>
        </div>
    </div>

    <audio id="audioStream" crossorigin="anonymous"></audio>

    <script>
        const audio = document.getElementById('audioStream');
        const btn = document.getElementById('mainButton');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const streamUrl = "https://streaming01.shockmedia.com.ar/8452/stream";

        btn.addEventListener('click', function() {
            if (audio.paused) {
                audio.src = streamUrl;
                audio.play().then(() => {
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                }).catch(err => console.log("Error al reproducir"));
            } else {
                audio.pause();
                audio.src = "";
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        });

        document.getElementById('volumeSlider').addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });
    </script>
</body>
</html>
