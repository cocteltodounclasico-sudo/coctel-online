<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cóctel Todo Un Clásico</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #d4af37;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 40px 20px;
            border-radius: 20px;
            background-color: #050505;
            max-width: 350px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }
        .logo {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .slogan {
            font-size: 0.7rem;
            letter-spacing: 5px;
            color: #fff;
            margin-bottom: 30px;
            opacity: 0.8;
        }
        .locutores {
            margin-bottom: 30px;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            padding: 15px 0;
        }
        .nombre {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.25rem;
            display: block;
            margin: 5px 0;
            letter-spacing: 1px;
        }
        /* REPRODUCTOR ESTÁNDAR (Como en la 1.6) */
        .player-box {
            margin: 25px 0;
        }
        audio {
            width: 100%;
            height: 45px;
        }
        .support-area {
            margin-top: 30px;
        }
        .frase {
            font-size: 0.75rem;
            color: #d4af37;
            font-style: italic;
            margin-bottom: 15px;
            display: block;
        }
        .btn-cafecito {
            display: inline-block;
            text-decoration: none;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Cóctel</div>
        <div class="slogan">TODO UN CLÁSICO</div>

        <div class="locutores">
            <span class="nombre">Pedro Aníbal Mansilla</span>
            <span class="nombre">Pablo Shefer</span>
        </div>

        <div class="player-box">
            <audio controls crossorigin="anonymous">
                <source src="https://stream.estudiosmax.com/8144/stream" type="audio/mpeg">
                Tu navegador no soporta el audio.
            </audio>
        </div>

        <div class="support-area">
            <span class="frase">"Ayudanos a mantener el vinilo girando"</span>
            <a href="https://cafecito.app/coctelon-line" target="_blank" class="btn-cafecito">
                ☕ Invitanos un Cafecito
            </a>
        </div>
    </div>

</body>
</html>
