<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cóctel Todo Un Clásico | On-Line</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --color-oro: #d4af37; --color-oscuro: #0a0a0a; --color-gris: #888; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--color-oscuro); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        /* El fondo negro profundo */
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #151515 0%, #000 100%); }
        
        .main-card { background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(8px); padding: 50px; border-radius: 40px; border: 1px solid rgba(212, 175, 55, 0.25); box-shadow: 0 30px 60px rgba(0,0,0,0.9); text-align: center; max-width: 400px; width: 90%; z-index: 10; }
        
        .logo-container h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; color: var(--color-oro); margin: 0; letter-spacing: -2px; text-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        .subtitulo { letter-spacing: 8px; font-size: 0.8rem; margin-bottom: 30px; color: var(--color-gris); text-transform: uppercase; }
        
        .vumetro { display: flex; justify-content: center; gap: 4px; height: 40px; margin-bottom: 25px; align-items: flex-end; }
        .v-bar { width: 6px; background: var(--color-oro); height: 4px; border-radius: 3px; transition: height 0.1s ease-out; }
        
        .btn-play { background: var(--color-oro); border: none; width: 90px; height: 90px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; transition: 0.3s; box-shadow: 0 10px 25px rgba(0,0,0,0.6); position: relative; }
        .btn-play svg { fill: var(--color-oscuro); width: 45px; height: 45px; }
        .btn-play:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(212, 175, 55, 0.5); }
        
        .staff { font-size: 0.8rem; color: var(--color-gris); margin-top: 20px; line-height: 1.6; }
        .vol-control { margin-top: 15px; }
        input[type=range] { accent-color: var(--color-oro); width: 140px; cursor: pointer; opacity: 0.7; }
        input[type=range]:hover { opacity: 1; }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    
    <div class="main-card">
        <div class="logo-container">
            <h1>CÓCTEL</h1>
            <div class="subtitulo">Todo Un Clásico</div>
        </div>
        
        <div class="vumetro" id="vumetro">
            <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
            <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
        </div>

        <button class="btn-play" id="mainButton">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <div class="vol-control">
            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
        </div>

        <div class="staff">
            Voces: Pedro Aníbal Mansilla & Pablo Shefer<br>
            <strong>www.cocteltodounclasico.com.ar</strong>
        </div>
    </div>

    <audio id="audioStream" crossorigin="anonymous"></audio>

    <script>
        const audio = document.getElementById('audioStream');
        const btn = document.getElementById('mainButton');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const vBars = document.querySelectorAll('.v-bar');
        
        const streamUrl = "https://streaming01.shockmedia.com.ar/8452/stream";

        btn.addEventListener('click', function() {
            if (audio.paused) {
                if (!audio.src) audio.src = streamUrl;
                audio.play().then(() => toggleUI(true)).catch(console.error);
            } else {
                audio.pause();
                audio.src = ""; 
                audio.load();
                toggleUI(false);
            }
        });

        function toggleUI(playing) {
            playIcon.style.display = playing ? 'none' : 'block';
            pauseIcon.style.display = playing ? 'block' : 'none';
            if(playing) startVumetro(); else stopVumetro();
        }

        let vuInterval;
        function startVumetro() {
            vuInterval = setInterval(() => {
                vBars.forEach(b => { b.style.height = (Math.random() * 38 + 4) + 'px'; });
            }, 100);
        }
        function stopVumetro() {
            clearInterval(vuInterval);
            vBars.forEach(b => { b.style.height = '4px'; });
        }

        document.getElementById('volumeSlider').addEventListener('input', (e) => audio.volume = e.target.value);

        // --- SISTEMA DE VINILOS ANIMADOS ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let vinyls = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Vinyl {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height; // Posición inicial aleatoria
            }
            reset() {
                this.size = Math.random() * 60 + 40; // Tamaño del disco
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + this.size;
                this.speed = Math.random() * 0.5 + 0.2;
                this.rotation = 0;
                this.rotSpeed = (Math.random() - 0.5) * 0.02;
                this.opacity = Math.random() * 0.2 + 0.05;
            }
            update() {
                this.y -= this.speed;
                this.rotation += this.rotSpeed;
                if (this.y < -this.size) this.reset();
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;
                
                // Disco Negro
                ctx.beginPath();
                ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                ctx.fillStyle = "#000";
                ctx.fill();
                
                // Surcos (Efecto de brillo)
                ctx.strokeStyle = "rgba(255,255,255,0.1)";
                for(let i=1; i<4; i++) {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * (i*0.25), 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Centro del disco (Oro)
                ctx.beginPath();
                ctx.arc(0, 0, this.size * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = "#d4af37";
                ctx.fill();
                
                // Agujero central
                ctx.beginPath();
                ctx.arc(0, 0, this.size * 0.05, 0, Math.PI * 2);
                ctx.fillStyle = "#151515";
                ctx.fill();
                
                ctx.restore();
            }
        }

        for(let i=0; i<15; i++) vinyls.push(new Vinyl());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            vinyls.forEach(v => {
                v.update();
                v.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
