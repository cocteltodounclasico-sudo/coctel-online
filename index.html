<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cóctel Todo Un Clásico | On-line</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --black: #0a0a0a;
            --gray: #1a1a1a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--black);
            color: white;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 30px 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            background: linear-gradient(145deg, #0f0f0f, #050505);
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            max-width: 400px;
            width: 90%;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: var(--gold);
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .slogan {
            font-size: 0.75rem;
            letter-spacing: 4px;
            color: white;
            margin-bottom: 25px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .locutores-box {
            margin-bottom: 25px;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            padding: 15px 0;
        }

        .locutor-nombre {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            color: var(--gold);
            margin: 5px 0;
            display: block;
            letter-spacing: 1px;
        }

        .player-box {
            background: var(--gray);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        audio {
            width: 100%;
            height: 45px;
            filter: invert(100%) hue-rotate(180deg) brightness(1.5);
        }

        .support-box {
            margin-top: 10px;
            padding-top: 10px;
        }

        .support-text {
            font-size: 0.7rem;
            color: var(--gold);
            margin-bottom: 12px;
            font-style: italic;
            opacity: 0.9;
        }

        .btn-cafecito {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 8px 18px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .btn-cafecito:hover {
            background-color: var(--gold);
            color: var(--black);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .footer {
            margin-top: 20px;
            font-size: 0.6rem;
            color: var(--gold);
            opacity: 0.4;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Cóctel</div>
        <div class="slogan">Todo un clásico</div>

        <div class="locutores-box">
            <span class="locutor-nombre">Pedro Aníbal Mansilla</span>
            <span class="locutor-nombre">Pablo Marcovsky</span>
        </div>

        <div class="player-box">
            <audio controls>
                <source src="https://stream.estudiosmax.com/8144/stream" type="audio/mpeg">
                Tu navegador no soporta el reproductor.
            </audio>
        </div>

        <div class="support-box">
            <div class="support-text">"Ayudanos a mantener el vinilo girando"</div>
            <a href="https://cafecito.app/coctelon-line" target="_blank" class="btn-cafecito">
                <span>☕ Invitanos un Cafecito</span>
            </a>
        </div>

        <div class="footer">EN VIVO | CALIDAD PREMIUM</div>
    </div>

</body>
</html>
