<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cóctel Todo Un Clásico | On-line</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --black: #0a0a0a;
            --gray: #161616;
        }

        body {
            margin: 0;
            background-color: var(--black);
            color: white;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 25px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            background: #050505;
            border-radius: 12px;
            max-width: 360px;
            width: 85%;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--gold);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .slogan {
            font-size: 0.7rem;
            letter-spacing: 3px;
            margin-bottom: 20px;
            opacity: 0.7;
        }

        .locutores-box {
            margin-bottom: 20px;
            padding: 10px 0;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }

        .locutor-nombre {
            font-family: 'Playfair Display', serif;
            font-size: 0.95rem; /* Letra más chica y elegante */
            color: var(--gold);
            margin: 4px 0;
            display: block;
            letter-spacing: 1px;
        }

        .player-box {
            background: #111;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        audio {
            width: 100%;
            height: 40px;
            /* Estética oscura natural */
        }

        .support-box {
            margin-top: 5px;
        }

        .support-text {
            font-size: 0.7rem;
            color: var(--gold);
            margin-bottom: 10px;
            font-style: italic;
        }

        .btn-cafecito {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.75rem;
        }

        .footer {
            margin-top: 20px;
            font-size: 0.6rem;
            color: var(--gold);
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Cóctel</div>
        <div class="slogan">Todo un clásico</div>

        <div class="locutores-box">
            <span class="locutor-nombre">PEDRO ANÍBAL MANSILLA</span>
            <span class="locutor-nombre">PABLO SHEFER</span>
        </div>

        <div class="player-box">
            <audio controls>
                <source src="https://stream.estudiosmax.com/8144/stream" type="audio/mpeg">
                Tu navegador no soporta el audio.
            </audio>
        </div>

        <div class="support-box">
            <div class="support-text">"Ayudanos a mantener el vinilo girando"</div>
            <a href="https://cafecito.app/coctelon-line" target="_blank" class="btn-cafecito">
                <span>☕ Invitanos un Cafecito</span>
            </a>
        </div>

        <div class="footer">EN VIVO | CALIDAD PREMIUM</div>
    </div>

</body>
</html>
