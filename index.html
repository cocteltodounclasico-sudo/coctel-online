<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cóctel Todo Un Clásico | On-Line</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --color-oro: #d4af37; --color-oscuro: #0a0a0a; --color-gris: #888; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--color-oscuro); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #111 0%, #000 100%); }
        
        .main-card { background: rgba(10, 10, 10, 0.92); backdrop-filter: blur(12px); padding: 40px; border-radius: 40px; border: 1px solid rgba(212, 175, 55, 0.3); box-shadow: 0 40px 80px rgba(0,0,0,0.9); text-align: center; max-width: 420px; width: 90%; z-index: 10; }
        
        .logo-container h1 { font-family: 'Playfair Display', serif; font-size: 3.2rem; color: var(--color-oro); margin: 0; letter-spacing: -1px; text-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
        .subtitulo { letter-spacing: 6px; font-size: 0.75rem; margin-bottom: 20px; color: var(--color-gris); text-transform: uppercase; }

        /* Estilo para el Texto Fijo de la Radio */
        #now-playing { height: 50px; margin-bottom: 20px; display: flex; flex-direction: column; justify-content: center; border-top: 1px solid rgba(212, 175, 55, 0.1); border-bottom: 1px solid rgba(212, 175, 55, 0.1); padding: 10px 0; }
        #track-title { font-weight: 600; color: #fff; font-size: 1rem; letter-spacing: 2px; }
        #track-artist { color: var(--color-oro); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 4px; margin-top: 2px; }

        .vumetro { display: flex; justify-content: center; gap: 5px; height: 50px; margin-bottom: 25px; align-items: flex-end; }
        .v-bar { width: 7px; background: linear-gradient(to top, #866d1d, var(--color-oro)); height: 4px; border-radius: 3px; transition: height 0.1s ease-out; }
        
        .btn-play { background: var(--color-oro); border: none; width: 85px; height: 85px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; transition: 0.3s; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
        .btn-play svg { fill: var(--color-oscuro); width: 40px; height: 40px; }
        .btn-play:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(212, 175, 55, 0.4); }
        
        .staff { font-size: 0.75rem; color: var(--color-gris); margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; }
        .vol-control { margin-top: 10px; }
        input[type=range] { accent-color: var(--color-oro); width: 120px; cursor: pointer; }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    
    <div class="main-card">
        <div class="logo-container">
            <h1>CÓCTEL</h1>
            <div class="subtitulo">Todo Un Clásico</div>
        </div>

        <div id="now-playing">
            <span id="track-title">LA MEJOR MÚSICA</span>
            <span id="track-artist">COCTEL ON-LINE</span>
        </div>
        
        <div class="vumetro" id="vumetro">
            <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
            <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
        </div>

        <button class="btn-play" id="mainButton">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <div class="vol-control">
            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
        </div>

        <div class="staff">
            Voces: Pedro Aníbal Mansilla & Pablo Shefer<br>
            <strong>cocteltodounclasico.com.ar</strong>
        </div>
    </div>

    <audio id="audioStream" crossorigin="anonymous"></audio>

<script>
        const audio = document.getElementById('audioStream');
        const btn = document.getElementById('mainButton');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const vBars = document.querySelectorAll('.v-bar');
        
        // El link de siempre
        const streamUrl = "https://streaming01.shockmedia.com.ar/8452/stream";

        btn.addEventListener('click', function() {
            if (audio.paused) {
                // OPTIMIZACIÓN: Limpiamos caché antes de arrancar para evitar sonido "cascado"
                audio.src = streamUrl;
                audio.setAttribute('preload', 'none'); 
                
                audio.play().then(() => {
                    toggleUI(true);
                }).catch(err => {
                    console.error("Error al reproducir:", err);
                });
            } else {
                audio.pause();
                // Al vaciar el src, el celular libera la memoria del audio
                audio.removeAttribute('src'); 
                audio.load();
                toggleUI(false);
            }
        });

        function toggleUI(playing) {
            playIcon.style.display = playing ? 'none' : 'block';
            pauseIcon.style.display = playing ? 'block' : 'none';
            if(playing) startVumetro(); else stopVumetro();
        }

        let vuInterval;
        function startVumetro() {
            if(vuInterval) clearInterval(vuInterval);
            vuInterval = setInterval(() => {
                vBars.forEach(b => { 
                    // Un salto un poquito más suave para no estresar el procesador
                    b.style.height = (Math.random() * 40 + 5) + 'px'; 
                });
            }, 120); // Bajamos un pelín la velocidad de actualización
        }

        function stopVumetro() {
            clearInterval(vuInterval);
            vBars.forEach(b => { b.style.height = '4px'; });
        }

        document.getElementById('volumeSlider').addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        // --- VINILOS OPTIMIZADOS PARA MÓVIL ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let vinyls = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class Vinyl {
            constructor() { this.reset(); this.y = Math.random() * canvas.height; }
            reset() {
                this.size = Math.random() * 70 + 40; 
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + this.size;
                this.speed = Math.random() * 0.3 + 0.1;
                this.rotation = 0;
                this.rotSpeed = (Math.random() - 0.5) * 0.01;
                this.opacity = Math.random() * 0.2 + 0.1;
            }
            update() {
                this.y -= this.speed;
                this.rotation += this.rotSpeed;
                if (this.y < -this.size) this.reset();
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;
                
                // Disco
                ctx.beginPath();
                ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                ctx.fillStyle = "#0a0a0a";
                ctx.fill();
                
                // Surcos (Reducimos cantidad para ganar velocidad)
                ctx.strokeStyle = "rgba(255,255,255,0.05)";
                for(let i=1; i<6; i++) {
                    ctx.beginPath(); ctx.arc(0, 0, this.size * (i*0.18), 0, Math.PI * 2); ctx.stroke();
                }

                // Centro Oro
                ctx.beginPath(); ctx.arc(0, 0, this.size * 0.35, 0, Math.PI * 2);
                ctx.fillStyle = "#d4af37"; ctx.fill();
                
                ctx.restore();
            }
        }

        // Bajamos a 8 vinilos para que el celular no sufra procesando audio y video a la vez
        for(let i=0; i<8; i++) vinyls.push(new Vinyl());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            vinyls.forEach(v => { v.update(); v.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
