<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cóctel Todo Un Clásico | On-line</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #0a0a0a;
            color: white;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 30px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            background-color: #000;
            border-radius: 15px;
            max-width: 350px;
            width: 85%;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: #d4af37;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .slogan {
            font-size: 0.65rem;
            letter-spacing: 4px;
            margin-bottom: 25px;
            opacity: 0.7;
        }

        .locutores {
            margin-bottom: 25px;
        }

        /* TIPOGRAFÍA ELEGANTE Y FINA PARA LOS NOMBRES */
        .nombre-locutor {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.1rem;
            color: #d4af37;
            display: block;
            margin: 5px 0;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .player-box {
            margin-bottom: 30px;
        }

        /* REPRODUCTOR ESTÁNDAR (El que no fallaba) */
        audio {
            width: 100%;
        }

        .support-box {
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            padding-top: 20px;
        }

        .frase-vinilo {
            font-size: 0.75rem;
            color: #d4af37;
            font-style: italic;
            margin-bottom: 15px;
            display: block;
        }

        .btn-cafecito {
            display: inline-block;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Cóctel</div>
        <div class="slogan">Todo un clásico</div>

        <div class="locutores">
            <span class="nombre-locutor">Pedro Aníbal Mansilla</span>
            <span class="nombre-locutor">Pablo Shefer</span>
        </div>

        <div class="player-box">
            <audio controls>
                <source src="https://stream.estudiosmax.com/8144/stream" type="audio/mpeg">
                Tu navegador no soporta el audio.
            </audio>
        </div>

        <div class="support-box">
            <span class="frase-vinilo">"Ayudanos a mantener el vinilo girando"</span>
            <a href="https://cafecito.app/coctelon-line" target="_blank" class="btn-cafecito">
                ☕ Invitanos un Cafecito
            </a>
        </div>
    </div>

</body>
</html>
