<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cóctel Todo Un Clásico | On-Line</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --color-oro: #d4af37; --color-oscuro: #0a0a0a; --color-gris: #888; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--color-oscuro); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .bg-fixed { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #151515 0%, #000 100%); }
        .main-card { background: rgba(10, 10, 10, 0.98); padding: 40px; border-radius: 40px; border: 1px solid rgba(212, 175, 55, 0.3); text-align: center; max-width: 400px; width: 85%; z-index: 10; box-shadow: 0 20px 50px rgba(0,0,0,0.9); }
        .logo-container h1 { font-family: 'Playfair Display', serif; font-size: 3rem; color: var(--color-oro); margin: 0; }
        .subtitulo { letter-spacing: 5px; font-size: 0.7rem; color: var(--color-gris); text-transform: uppercase; margin-bottom: 20px; }
        #info-box { border-top: 1px solid rgba(212,175,55,0.1); border-bottom: 1px solid rgba(212,175,55,0.1); padding: 15px 0; margin-bottom: 25px; }
        .info-title { font-weight: 600; color: #fff; display: block; letter-spacing: 1px; }
        .info-sub { color: var(--color-oro); font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; }
        .btn-play { background: var(--color-oro); border: none; width: 90px; height: 90px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .btn-play svg { fill: var(--color-oscuro); width: 45px; height: 45px; }
        input[type=range] { accent-color: var(--color-oro); width: 140px; cursor: pointer; }
        .staff { font-size: 0.75rem; color: var(--color-gris); line-height: 1.6; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; margin-top: 20px; }
        .staff strong { color: #aaa; display: block; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="bg-fixed"></div>
    <div class="main-card">
        <div class="logo-container">
            <h1>CÓCTEL</h1>
            <div class="subtitulo">Todo Un Clásico</div>
        </div>
        <div id="info-box">
            <span class="info-title">LA MEJOR MÚSICA</span>
            <span class="info-sub">EN VIVO 24HS</span>
        </div>
        <button class="btn-play" id="mainButton">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <div class="vol-control">
            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
        </div>
        <div class="staff">
            Voces: Pedro Aníbal Mansilla & Pablo Shefer
            <strong>www.cocteltodounclasico.com.ar</strong>
        </div>
    </div>

    <audio id="audioStream" preload="none" crossorigin="anonymous"></audio>

    <script>
        const audio = document.getElementById('audioStream');
        const btn = document.getElementById('mainButton');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        
        // URL con parámetro de tiempo para limpiar cualquier caché del servidor
        const streamUrl = "https://streaming01.shockmedia.com.ar/8452/stream?type=.mp3";

        btn.addEventListener('click', function() {
            if (audio.paused) {
                // Forzamos la recarga limpia del stream
                audio.src = streamUrl + "&t=" + new Date().getTime();
                audio.load();
                
                let playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        playIcon.style.display = 'none';
                        pauseIcon.style.display = 'block';
                    }).catch(err => {
                        console.log("Error de reproducción");
                    });
                }
            } else {
                audio.pause();
                audio.src = ""; // Liberamos la memoria totalmente
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        });

        document.getElementById('volumeSlider').addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });
    </script>
</body>
</html>
