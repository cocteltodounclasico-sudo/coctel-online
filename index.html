<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cóctel On-Line | Clásicos de Selección</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --color-oro: #d4af37; --color-oscuro: #0a0a0a; --color-gris: #888; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--color-oscuro); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); }
        .main-card { background: rgba(21, 21, 21, 0.85); backdrop-filter: blur(10px); padding: 50px; border-radius: 40px; border: 1px solid rgba(212, 175, 55, 0.2); box-shadow: 0 30px 60px rgba(0,0,0,0.8); text-align: center; max-width: 400px; width: 90%; }
        .logo-container h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; color: var(--color-oro); margin: 0; letter-spacing: -2px; }
        .subtitulo { letter-spacing: 8px; font-size: 0.8rem; margin-bottom: 30px; color: var(--color-gris); text-transform: uppercase; }
        .vumetro { display: flex; justify-content: center; gap: 4px; height: 40px; margin-bottom: 25px; align-items: flex-end; }
        .v-bar { width: 6px; background: var(--color-oro); height: 4px; border-radius: 3px; transition: height 0.1s; }
        .btn-play { background: var(--color-oro); border: none; width: 85px; height: 85px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; transition: 0.3s; }
        .btn-play svg { fill: var(--color-oscuro); width: 40px; height: 40px; }
        .btn-play:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        .staff { font-size: 0.75rem; color: var(--color-gris); margin-top: 15px; line-height: 1.5; }
        input[type=range] { accent-color: var(--color-oro); width: 120px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="main-card">
        <div class="logo-container">
            <h1>CÓCTEL</h1>
            <div class="subtitulo">On-Line</div>
        </div>
        <div class="vumetro" id="vumetro">
            <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
            <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
        </div>
        <button class="btn-play" id="mainButton">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <div style="margin-bottom: 5px; font-size: 0.7rem; color: #888;">VOLUMEN</div>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
        <div class="staff">
            Voces: Pedro Aníbal Mansilla & Pablo Shefer<br>
            <small>Clásicos de Selección</small>
        </div>
    </div>

    <audio id="audioStream" crossorigin="anonymous"></audio>

   <script>
    const audio = document.getElementById('audioStream');
    const btn = document.getElementById('mainButton');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const vBars = document.querySelectorAll('.v-bar');
    const volumeSlider = document.getElementById('volumeSlider');

    // CONFIGURACIÓN PARA MYRADIOSTREAM GRATUITO
    // Tu IP y puerto de siempre
    const serverURL = "http://s9.myradiostream.com:47566/;stream.mp3";
    
    // Usamos un proxy que "limpia" la seguridad para que el celu lo acepte
    const proxyUrl = "https://images1-focus-opensocial.googleusercontent.com/gadgets/proxy?container=focus&refresh=60&url=" + encodeURIComponent(serverURL);

    btn.addEventListener('click', function() {
        if (audio.paused) {
            // Intentamos con el proxy de Google (muy estable)
            audio.src = proxyUrl;
            
            audio.play().then(() => {
                actualizarInterfaz(true);
            }).catch(error => {
                console.log("Reintentando con proxy secundario...");
                // Si falla, usamos este otro puente
                audio.src = "https://cors-proxy.htmldriven.com/?url=" + encodeURIComponent(serverURL);
                audio.play().then(() => actualizarInterfaz(true));
            });
        } else {
            audio.pause();
            audio.src = ""; 
            actualizarInterfaz(false);
        }
    });

    function actualizarInterfaz(isPlay) {
        if (isPlay) {
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
            startVumetro();
        } else {
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            stopVumetro();
        }
    }

    let vumetroInterval;
    function startVumetro() {
        vumetroInterval = setInterval(() => {
            vBars.forEach(bar => {
                bar.style.height = (Math.random() * 35 + 5) + 'px';
            });
        }, 100);
    }

    function stopVumetro() {
        clearInterval(vumetroInterval);
        vBars.forEach(bar => bar.style.height = '4px');
    }

    volumeSlider.addEventListener('input', (e) => {
        audio.volume = e.target.value;
    });

    // Fondo animado (el que ya tenías)
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let pts = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    for(let i=0; i<40; i++) pts.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*2, vx:Math.random()*0.3-0.15, vy:Math.random()*0.3-0.15});
    function anim() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "rgba(212,175,55,0.2)";
        pts.forEach(p => {
            p.x+=p.vx; p.y+=p.vy;
            if(p.x<0)p.x=canvas.width; if(p.x>canvas.width)p.x=0;
            if(p.y<0)p.y=canvas.height; if(p.y>canvas.height)p.y=0;
            ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,Math.PI*2); ctx.fill();
        });
        requestAnimationFrame(anim);
    }
    anim();
</script>
</body>
</html>
