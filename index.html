<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cóctel Todo Un Clásico | On-line</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --black: #0a0a0a;
        }

        body {
            margin: 0;
            background-color: var(--black);
            color: white;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 30px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            background: linear-gradient(180deg, #0f0f0f 0%, #050505 100%);
            border-radius: 20px;
            max-width: 350px;
            width: 85%;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .slogan {
            font-size: 0.65rem;
            letter-spacing: 4px;
            margin-bottom: 25px;
            opacity: 0.6;
            text-transform: uppercase;
        }

        .locutores-box {
            margin-bottom: 25px;
            padding: 15px 0;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }

        .locutor-nombre {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-style: italic; /* Más elegancia */
            color: var(--gold);
            margin: 2px 0;
            display: block;
            font-weight: 400;
        }

        .player-box {
            background: #000;
            padding: 15px;
            border-radius: 50px; /* Estilo cápsula */
            margin-bottom: 25px;
            border: 1px solid rgba(212, 175, 55, 0.1);
        }

        audio {
            width: 100%;
            height: 40px;
        }

        .support-box {
            margin-top: 10px;
        }

        .support-text {
            font-size: 0.7rem;
            color: var(--gold);
            margin-bottom: 12px;
            font-style: italic;
            letter-spacing: 1px;
        }

        .btn-cafecito {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .btn-cafecito:hover {
            background: var(--gold);
            color: black;
        }

        .footer {
            margin-top: 25px;
            font-size: 0.6rem;
            color: var(--gold);
            opacity: 0.3;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Cóctel</div>
        <div class="slogan">Todo un clásico</div>

        <div class="locutores-box">
            <span class="locutor-nombre">Pedro Aníbal Mansilla</span>
            <span class="locutor-nombre">Pablo Shefer</span>
        </div>

        <div class="player-box">
            <audio id="radioPlayer" controls>
                <source src="https://stream.estudiosmax.com/8144/stream" type="audio/mpeg">
                Tu navegador no soporta el audio.
            </audio>
        </div>

        <div class="support-box">
            <div class="support-text">"Ayudanos a mantener el vinilo girando"</div>
            <a href="https://cafecito.app/coctelon-line" target="_blank" class="btn-cafecito">
                <span>☕ Invitanos un Cafecito</span>
            </a>
        </div>

        <div class="footer">EN VIVO | CALIDAD PREMIUM</div>
    </div>

    <script>
        // Este pequeño código ayuda a que el reproductor no se bloquee al cargar
        const player = document.getElementById('radioPlayer');
        player.addEventListener('play', () => {
            console.log('Reproduciendo Cóctel...');
        });
    </script>
</body>
</html>
