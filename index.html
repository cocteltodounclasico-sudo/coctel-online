/* Fondo Cóctel On-line: Vinilos de Colores Estáticos - Versión 1.4 */
body {
    margin: 0;
    padding: 0;
    background-color: #000;
    /* Usamos una imagen fija con un degradado de color azul y dorado para dar vida */
    background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(20, 20, 50, 0.85)), 
                      url('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=2000&auto=format&fit=crop');
    background-attachment: fixed; /* Imagen anclada, no se mueve al hacer scroll */
    background-size: cover;
    background-position: center;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
}

/* Capa de color fija para resaltar las notas musicales y los discos sin procesos de CPU */
body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    /* Un toque de azul neón y dorado sutil que no consume recursos */
    background: radial-gradient(circle at 10% 10%, rgba(0, 100, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(212, 175, 55, 0.15) 0%, transparent 40%);
    pointer-events: none;
    z-index: -1;
}
</style>
