<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cóctel Todo Un Clásico | On-Line</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --color-oro: #d4af37; --color-oscuro: #0a0a0a; --color-gris: #888; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--color-oscuro); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        /* Fondo estático con degradado (Cero consumo de CPU) */
        .bg-fixed { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #151515 0%, #000 100%); }

        /* Vinilos animados con CSS (Usa la GPU del celular) */
        .vinyl-css {
            position: absolute;
            width: 100px; height: 100px;
            background: radial-gradient(circle, #333 0%, #111 40%, #000 100%);
            border-radius: 50%;
            opacity: 0.15;
            z-index: -1;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.1);
            animation: float 20s linear infinite, spin 5s linear infinite;
        }
        /* El centro dorado del vinilo */
        .vinyl-css::after {
            content: ''; position: absolute; top: 35%; left: 35%; width: 30%; height: 30%;
            background: var(--color-oro); border-radius: 50%;
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes float {
            0% { top: 110%; left: 10%; }
            100% { top: -20%; left: 15%; }
        }

        .main-card { background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px); padding: 40px; border-radius: 40px; border: 1px solid rgba(212, 175, 55, 0.3); text-align: center; max-width: 400px; width: 85%; z-index: 10; }
        .logo-container h1 { font-family: 'Playfair Display', serif; font-size: 3rem; color: var(--color-oro); margin: 0; }
        .subtitulo { letter-spacing: 5px; font-size: 0.7rem; color: var(--color-gris); text-transform: uppercase; margin-bottom: 20px; }
        
        #info-box { border-top: 1px solid rgba(212,175,55,0.1); border-bottom: 1px solid rgba(212,175,55,0.1); padding: 10px 0; margin-bottom: 20px; }
        .info-title { font-weight: 600; color: #fff; display: block; }
        .info-sub { color: var(--color-oro); font-size: 0.7rem; letter-spacing: 3px; }

        .btn-play { background: var(--color-oro); border: none; width: 80px; height: 80px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; }
        .btn-play svg { fill: var(--color-oscuro); width: 35px; height: 35px; }
        
        input[type=range] { accent-color: var(--color-oro); width: 100px; }
    </style>
</head>
<body>
    <div class="bg-fixed"></div>
    
    <div class="vinyl-css" style="width: 150px; height: 150px; animation-duration: 25s, 8s; left: 5%;"></div>
    <div class="vinyl-css" style="width: 100px; height: 100px; animation-duration: 30s, 6s; left: 70%; animation-delay: 5s;"></div>
    <div class="vinyl-css" style="width: 180px; height: 180px; animation-duration: 35s, 10s; left: 40%; animation-delay: 10s;"></div>

    <div class="main-card">
        <div class="logo-container">
            <h1>CÓCTEL</h1>
            <div class="subtitulo">Todo Un Clásico</div>
        </div>
        <div id="info-box">
            <span class="info-title">LA MEJOR MÚSICA</span>
            <span class="info-sub">EN VIVO 24HS</span>
        </div>
        <button class="btn-play" id="mainButton">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
        <div style="font-size: 0.7rem; color: var(--color-gris); margin-top: 20px;">
            www.cocteltodounclasico.com.ar
        </div>
    </div>

    <audio id="audioStream" crossorigin="anonymous"></audio>

    <script>
        const audio = document.getElementById('audioStream');
        const btn = document.getElementById('mainButton');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const streamUrl = "https://streaming01.shockmedia.com.ar/8452/stream";

        btn.addEventListener('click', function() {
            if (audio.paused) {
                audio.src = streamUrl;
                audio.play().then(() => {
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                });
            } else {
                audio.pause();
                audio.src = "";
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        });

        document.getElementById('volumeSlider').addEventListener('input', (e) => audio.volume = e.target.value);
    </script>
</body>
</html>
